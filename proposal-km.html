  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showToast(msg) {
    const area = document.getElementById('toastArea');
    const el = document.createElement('div');
    el.className = 'toast-pop pointer-events-auto bg-[#111827] text-white text-xs sm:text-sm px-4 py-2.5 rounded-md shadow-lg max-w-sm';
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function copyText(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
    } else {
      fallbackCopy(text, msg);
    }
  }

  function fallbackCopy(text, msg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(msg); } catch (e) { showToast('សូម Copy ដោយដៃ'); }
    document.body.removeChild(ta);
  }

  function updateReadinessBadge() {
    let checked = 0;
    const total = state.members.length * PREREQS.length;
    state.members.forEach(m => PREREQS.forEach(p => { if (m.passed[p]) checked++; }));
    const repoBonus = state.repoUrl.trim().length > 8 ? 1 : 0;
    const pct = Math.round(((checked + repoBonus) / (total + 1)) * 100);
    document.getElementById('readinessBadge').textContent = `FST-01 Ready: ${pct}%`;
  }

          <div class="p-3.5 bg-[#FAF9F6] border border-[#E5E2DC] rounded-md">
            <p class="font-mono-code text-xs text-[#14532D] font-semibold">Back-end (Host ហ្វ្រីលើ Render + Docker)</p>
            <p class="font-semibold text-[#111827] mt-1">Python FastAPI + JWT + WeasyPrint / OpenPyXL</p>
          </div>
          <div class="p-3.5 bg-[#FAF9F6] border border-[#E5E2DC] rounded-md">
            <p class="font-mono-code text-xs text-[#14532D] font-semibold">Database &amp; CI/CD ($0)</p>
            <p class="font-semibold text-[#111827] mt-1">PostgreSQL (Supabase/Neon) + GitHub Actions</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-4 space-y-1.5">
            ${state.schemaTables.map((t, i) => `
              <button type="button" data-tbl="${t.name}" class="w-full text-left px-3.5 py-2.5 rounded-md border text-sm font-mono-code transition-colors ${t.name === active.name ? 'bg-[#111827] text-white border-[#111827]' : 'bg-white text-[#111827] border-[#E5E2DC] hover:bg-[#FAF9F6]'}">
                ${i + 1}. ${t.name}
              </button>
            `).join('')}
          </div>
          <div class="lg:col-span-8 border border-[#E5E2DC] rounded-md p-5 bg-[#FAF9F6]/60">
            <h3 class="font-mono-code text-lg font-semibold text-[#14532D]">Table: ${active.name}</h3>
            <p class="text-sm text-[#4B5563] mt-1 mb-4">${esc(active.purpose)}</p>
            <table class="w-full text-left text-xs sm:text-sm border-collapse">
              <thead>
                <tr class="border-b border-[#111827] text-[#4B5563]">
                  <th class="py-2 pr-3">Column</th>
                  <th class="py-2 pr-3">Type / Key</th>
                  <th class="py-2">ការពន្យល់</th>
                </tr>
              </thead>
              <tbody>
                ${active.cols.map(col => `
                  <tr class="border-b border-[#E5E2DC]">
                    <td class="py-2.5 pr-3 font-mono-code font-semibold text-[#111827]">${esc(col.c)}</td>
                    <td class="py-2.5 pr-3 font-mono-code text-xs text-[#14532D]">${esc(col.t)}</td>
                    <td class="py-2.5 text-[#4B5563]">${esc(col.d)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </section>
    `;
  }

  // ---------- TAB 5: 20-WEEK GANTT ----------
  function renderGantt() {
    const doneCount = state.phases.filter(p => p.done).length;
    const pct = Math.round((doneCount / state.phases.length) * 100);

    return `
      <section class="bg-white border border-[#E5E2DC] rounded-lg p-5 sm:p-7 space-y-6">
        <div class="flex flex-wrap items-start justify-between gap-4 border-b border-[#E5E2DC] pb-4">
          <div>
            <h2 class="text-xl sm:text-2xl font-bold text-[#111827]">ផ្នែកទី ៥៖ កាលវិភាគអនុវត្ត ២០ សប្តាហ៍ (Interactive Gantt Chart)</h2>
            <p class="text-sm text-[#4B5563] mt-1">ចុចធីកដំណាក់កាលដែលក្រុមអ្នកបានធ្វើរួច ដើម្បីតាមដានវឌ្ឍនភាពរហូតដល់ Final Defense សប្តាហ៍ទី ២០។</p>
          </div>
          <div class="text-right">
            <span class="font-mono-code text-sm font-semibold text-[#14532D]">វឌ្ឍនភាពក្រុម៖ ${pct}% (${doneCount}/7)</span>
            <div class="w-44 h-2 bg-[#E5E2DC] rounded-full overflow-hidden mt-1.5">
              <div class="h-full bg-[#14532D] transition-all" style="width:${pct}%"></div>
            </div>
          </div>
        </div>

        <div class="space-y-4">
          ${state.phases.map(p => `
            <div class="border border-[#E5E2DC] rounded-md p-4 ${p.done ? 'bg-[#FAF9F6]' : 'bg-white'}">
              <div class="flex flex-wrap items-start justify-between gap-2">
                <label class="flex items-start gap-3 cursor-pointer">
                  <input type="checkbox" data-phase="${p.id}" ${p.done ? 'checked' : ''} class="mt-1 accent-[#14532D]">
                  <div>
                    <span class="font-semibold text-[#111827]">${esc(p.weeks)} — ${esc(p.title)}</span>
                    <p class="text-xs sm:text-sm text-[#4B5563] mt-0.5">${esc(p.desc)}</p>
                  </div>
                </label>
                <span class="font-mono-code text-xs ${p.done ? 'text-[#14532D] font-semibold' : 'text-[#4B5563]'}">${p.done ? 'DONE' : 'UPCOMING'}</span>
              </div>
              <div class="mt-3 h-2.5 w-full bg-[#F2EFE9] rounded-full relative overflow-hidden">
                <div class="h-full rounded-full ${p.done ? 'bg-[#14532D]' : 'bg-[#64748B]'}" style="margin-left:${p.start}%; width:${p.span}%;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  }

  // ---------- RENDER ----------
  function render() {
    const root = document.getElementById('proposalRoot');
    if (state.activeTab === 'team') root.innerHTML = renderTeam();
    else if (state.activeTab === 'problem') root.innerHTML = renderProblem();
    else if (state.activeTab === 'bench') root.innerHTML = renderBench();
    else if (state.activeTab === 'schema') root.innerHTML = renderSchema();
    else if (state.activeTab === 'gantt') root.innerHTML = renderGantt();

    document.querySelectorAll('#mainTabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === state.activeTab);
    });
    updateReadinessBadge();
  }

  // ---------- EVENTS ----------
  document.getElementById('mainTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    state.activeTab = btn.dataset.tab;
    render();
  });

  const root = document.getElementById('proposalRoot');
  root.addEventListener('click', (e) => {
    if (e.target.id === 'btnCheckAll') {
      state.members.forEach(m => PREREQS.forEach(p => { m.passed[p] = true; }));
      showToast('បានធីកជាប់គ្រប់មុខវិជ្ជាមូលដ្ឋានទាំងអស់ (30/30)!');
      render();
      return;
    }
    if (e.target.id === 'btnCopyFstSummary') {
      const txt = `LoopFactory KH — ACLEDA University FST Team (5 Members)\n1. Ponloeng Bora (0006580, GPA 3.87) - Project Lead\n2. Phal Raksa (0007679, GPA 3.90) - Back-end & DB\n3. Tan Mengkoung (0005957, GPA 3.80) - Front-end / QA\n4. Hak Vuttey (0007635, GPA 3.75) - Front-end / QA\n5. Chea Saroeurn (0007912, GPA 3.82) - Front-end / QA\nRepo: ${state.repoUrl || '[Pending Private GitHub URL]'}`;
      copyText(txt, 'បាន Copy ព័ត៌មានក្រុមរួចរាល់!');
      return;
    }
    if (e.target.id === 'btnCopyProblem') {
      const txt = `LoopFactory KH — សង្ខេបបញ្ហា៖ កម្ពុជាមានរោងចក្រ 3,386 (MISTI 2026) និងសំណល់ក្រណាត់ 179,956 តោន/ឆ្នាំ (GIZ FABRIC) រួមជាមួយអង្កាម និងសំបកស្វាយចន្ទី (~$20/តោន, MDPI 2026)។ ដោយខ្វះ Platform ឌីជីថល របស់សល់ទាំងនេះត្រូវចាក់ចោល ឬដុតក្នុងឡឥដ្ឋខុសច្បាប់។ LoopFactory KH ជួយភ្ជាប់រោងចក្រជាមួយអ្នកកែច្នៃដែលបាន Verify និងចេញរបាយការណ៍ MISTI មុនថ្ងៃចាកចេញពី LDC (19 Dec 2029)។`;
      copyText(txt, 'បាន Copy សង្ខេបបញ្ហាជាភាសាខ្មែររួចរាល់!');
      return;
    }
    const scBtn = e.target.closest('button[data-scope]');
    if (scBtn) { state.scopeView = scBtn.dataset.scope; render(); return; }
    const bfBtn = e.target.closest('button[data-bf]');
    if (bfBtn) { state.benchFilter = bfBtn.dataset.bf; render(); return; }
    const tblBtn = e.target.closest('button[data-tbl]');
    if (tblBtn) { state.selectedTable = tblBtn.dataset.tbl; render(); return; }
  });

  root.addEventListener('change', (e) => {
    if (e.target.dataset.mem !== undefined) {
      const m = state.members[Number(e.target.dataset.mem)];
      if (m) m.passed[e.target.dataset.pre] = e.target.checked;
      render();
      return;
    }
    if (e.target.dataset.phase !== undefined) {
      const ph = state.phases.find(x => x.id === Number(e.target.dataset.phase));
      if (ph) {
        ph.done = e.target.checked;
        showToast(ph.done ? `បានធីកបញ្ចប់៖ ${ph.title}` : `បានដកធីក៖ ${ph.title}`);
        render();
      }
    }
  });

  root.addEventListener('input', (e) => {
    if (e.target.id === 'repoInput') {
      state.repoUrl = e.target.value;
      updateReadinessBadge();
    }
  });

  render();
})();
</script>
</body>
</html>
